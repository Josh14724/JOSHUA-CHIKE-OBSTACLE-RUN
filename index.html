<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>
Joshua Chike - Railway Runner
</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #06101e;

    font-family:
        Arial,
        sans-serif;

    touch-action: none;
}


/* =====================================================
   GAME
===================================================== */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:

        linear-gradient(
            #78c7f0 0%,
            #d7f1ff 38%,
            #7ba46c 39%,
            #355a35 100%
        );
}


/* =====================================================
   SKY
===================================================== */

#sky {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 48%;

    background:

        linear-gradient(
            to bottom,
            #3c9bd4,
            #bdeaff
        );

    z-index: 0;
}


/* CLOUDS
===================================================== */

.cloud {

    position: absolute;

    width: 130px;
    height: 35px;

    background: white;

    border-radius: 50px;

    opacity: .8;

    filter: blur(.5px);
}

.cloud::before {

    content: "";

    position: absolute;

    width: 60px;
    height: 60px;

    left: 20px;
    top: -25px;

    background: white;

    border-radius: 50%;
}

.cloud::after {

    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    right: 18px;
    top: -20px;

    background: white;

    border-radius: 50%;
}

.cloud1 {

    top: 90px;
    left: 8%;
}

.cloud2 {

    top: 150px;
    right: 5%;

    transform: scale(.7);
}


/* =====================================================
   DISTANT CITY
===================================================== */

#city {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 48%;

    height: 110px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 5px;

    z-index: 1;

    opacity: .8;
}

.building {

    width: 30px;

    background: #547083;

    border-radius:
        2px 2px 0 0;
}

.building:nth-child(1) {
    height: 55px;
}

.building:nth-child(2) {
    height: 90px;
}

.building:nth-child(3) {
    height: 70px;
}

.building:nth-child(4) {
    height: 105px;
}

.building:nth-child(5) {
    height: 62px;
}

.building:nth-child(6) {
    height: 82px;
}

.building:nth-child(7) {
    height: 48px;
}


/* =====================================================
   GROUND
===================================================== */

#ground {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 55%;

    background:

        linear-gradient(
            90deg,
            #254a2c,
            #507a3d 50%,
            #254a2c
        );

    clip-path:

        polygon(
            0 0,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 2;
}


/* =====================================================
   TRACK BED
===================================================== */

#trackArea {

    position: absolute;

    left: 50%;

    top: 40%;

    width: 100%;

    height: 70%;

    transform:
        translateX(-50%);

    z-index: 3;

    overflow: hidden;
}


/* THREE TRACKS */

.track {

    position: absolute;

    bottom: -10%;

    width: 30%;

    height: 110%;

    background:

        repeating-linear-gradient(
            to bottom,
            #242424 0px,
            #242424 10px,
            #343434 11px,
            #343434 25px
        );

    border-left:
        8px solid #111;

    border-right:
        8px solid #111;

    transform-origin:
        center bottom;
}


/* LEFT */

.track.left {

    left: -2%;

    transform:
        perspective(350px)
        rotateY(24deg);
}


/* CENTER */

.track.center {

    left: 35%;

    transform:
        perspective(350px)
        rotateY(0deg);
}


/* RIGHT */

.track.right {

    right: -2%;

    transform:
        perspective(350px)
        rotateY(-24deg);
}


/* =====================================================
   RAILS
===================================================== */

.rail {

    position: absolute;

    bottom: 0;

    width: 5px;

    height: 100%;

    background:
        linear-gradient(
            to right,
            #777,
            #eee,
            #777
        );

    box-shadow:
        0 0 5px #000;
}

.track .rail1 {
    left: 20%;
}

.track .rail2 {
    right: 20%;
}


/* =====================================================
   SLEEPERS
===================================================== */

.sleeper {

    position: absolute;

    left: 0;
    right: 0;

    height: 9px;

    background:
        #5b351d;

    box-shadow:
        0 2px 3px #000;

    animation:
        trackMove
        .55s
        linear
        infinite;
}

.s1 {
    top: 20%;
}

.s2 {
    top: 35%;
}

.s3 {
    top: 50%;
}

.s4 {
    top: 65%;
}

.s5 {
    top: 80%;
}

.s6 {
    top: 95%;
}

@keyframes trackMove {

    from {
        transform:
            translateY(-15px);
    }

    to {
        transform:
            translateY(25px);
    }
}


/* =====================================================
   LOGO
===================================================== */

#logo {

    position: absolute;

    top: 15px;
    left: 15px;

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        #e60012;

    border:
        4px solid white;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    z-index: 50;

    box-shadow:
        0 4px 15px #0008;
}

#logo strong {

    font-size: 23px;
}

#logo span {

    font-size: 8px;

    font-weight: bold;
}


/* =====================================================
   HUD
===================================================== */

#hud {

    position: absolute;

    right: 15px;
    top: 18px;

    z-index: 50;

    color: white;

    text-align: right;

    text-shadow:
        0 2px 5px black;

    font-weight: bold;
}

#score {

    font-size: 28px;

    letter-spacing: 2px;
}

.hudItem {

    margin-top: 7px;

    font-size: 16px;
}


/* =====================================================
   PAUSE
===================================================== */

#pause {

    position: absolute;

    left: 100px;
    top: 17px;

    width: 58px;
    height: 58px;

    z-index: 50;

    border:
        3px solid white;

    border-radius: 12px;

    background:
        #182536cc;

    color: white;

    font-size: 25px;

    font-weight: bold;
}


/* =====================================================
   PLAYER
===================================================== */

#player {

    position: absolute;

    width: 65px;
    height: 125px;

    left: 50%;

    bottom: 105px;

    transform:
        translateX(-50%);

    z-index: 25;

    transition:
        left .07s linear;
}


/* HEAD */

.playerHead {

    position: absolute;

    width: 40px;
    height: 40px;

    left: 12px;

    top: 0;

    border-radius: 50%;

    background:
        #a96749;

    border:
        2px solid #3a2018;
}


/* HAIR */

.playerHead::before {

    content: "";

    position: absolute;

    width: 40px;
    height: 20px;

    left: -2px;
    top: -3px;

    background:
        #17110f;

    border-radius:
        50% 50% 20% 20%;
}


/* BODY */

.playerBody {

    position: absolute;

    width: 45px;
    height: 57px;

    left: 10px;
    top: 37px;

    background:
        #e60012;

    border:
        2px solid #8b0000;

    border-radius: 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-weight: 900;

    font-size: 13px;
}


/* ARMS */

.arm {

    position: absolute;

    width: 12px;
    height: 43px;

    top: 43px;

    background:
        #e60012;

    border-radius: 10px;

    transform-origin:
        top center;

    animation:
        armRun .22s
        infinite alternate;
}

.arm.left {

    left: 3px;
}

.arm.right {

    right: 3px;

    animation-delay:
        .11s;
}

@keyframes armRun {

    from {
        transform:
            rotate(30deg);
    }

    to {
        transform:
            rotate(-30deg);
    }
}


/* LEGS */

.leg {

    position: absolute;

    width: 14px;
    height: 40px;

    top: 90px;

    background:
        #202838;

    border-radius: 7px;

    transform-origin:
        top center;

    animation:
        legRun .22s
        infinite alternate;
}

.leg.left {

    left: 13px;
}

.leg.right {

    right: 13px;

    animation-delay:
        .11s;
}

@keyframes legRun {

    from {
        transform:
            rotate(25deg);
    }

    to {
        transform:
            rotate(-25deg);
    }
}


/* =====================================================
   TRAIN
===================================================== */

.obstacle {

    position: absolute;

    left: 50%;

    z-index: 20;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    pointer-events: none;
}


/* TRAIN BODY */

.train {

    width: 125px;
    height: 85px;

    border-radius:
        12px 12px 5px 5px;

    background:

        linear-gradient(
            #ef2633,
            #8d0710
        );

    border:
        4px solid #111;

    box-shadow:
        0 10px 20px #0009;

    position: relative;
}


/* TRAIN WINDOWS */

.train::before {

    content: "";

    position: absolute;

    width: 72px;
    height: 32px;

    left: 22px;
    top: 12px;

    background:
        linear-gradient(
            90deg,
            #9eeaff,
            #357e9c
        );

    border:
        3px solid #111;

    border-radius: 5px;
}


/* TRAIN LIGHT */

.train::after {

    content: "●";

    position: absolute;

    bottom: 7px;
    left: 50%;

    transform:
        translateX(-50%);

    color:
        #fff5a0;

    font-size:
        25px;

    text-shadow:
        0 0 12px yellow;
}


/* =====================================================
   CAR
===================================================== */

.car {

    width: 95px;
    height: 52px;

    border-radius:
        14px 14px 7px 7px;

    background:

        linear-gradient(
            #2992e5,
            #123f78
        );

    border:
        3px solid #111;

    box-shadow:
        0 10px 18px #0009;

    position: relative;
}


/* CAR WINDOW */

.car::before {

    content: "";

    position: absolute;

    width: 55px;
    height: 23px;

    left: 17px;
    top: -13px;

    background:
        #8bdfff;

    border:
        3px solid #111;

    border-radius:
        8px 8px 2px 2px;
}


/* CAR WHEELS */

.car::after {

    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    left: 10px;
    bottom: -10px;

    border-radius: 50%;

    background: #111;

    box-shadow:
        58px 0 #111;
}


/* =====================================================
   COIN
===================================================== */

.coin {

    position: absolute;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #fff8a0,
            #ffd000 55%,
            #bd7800
        );

    border:
        3px solid white;

    box-shadow:
        0 0 20px #ffd000;

    z-index: 22;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        #8b5a00;

    font-size:
        18px;

    font-weight:
        900;

    animation:
        coinSpin .5s
        linear infinite;
}

@keyframes coinSpin {

    0% {
        transform:
            translateX(-50%)
            rotateY(0deg);
    }

    50% {
        transform:
            translateX(-50%)
            rotateY(90deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotateY(180deg);
    }
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        #0006;
}

#startButton {

    padding:
        18px 40px;

    border:
        none;

    border-radius:
        18px;

    background:
        #e60012;

    color:
        white;

    font-size:
        23px;

    font-weight:
        900;

    box-shadow:
        0 8px 25px #0008;
}


/* =====================================================
   GAME OVER
===================================================== */

#gameOver {

    position: absolute;

    display: none;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%,-50%);

    z-index: 100;

    color:
        white;

    text-align:
        center;

    font-size:
        30px;

    font-weight:
        900;

    text-shadow:
        0 3px 8px black;
}

#restart {

    margin-top:
        15px;

    padding:
        14px 28px;

    border:
        none;

    border-radius:
        12px;

    background:
        #e60012;

    color:
        white;

    font-size:
        18px;

    font-weight:
        bold;
}


/* =====================================================
   CONTROLS
===================================================== */

#controls {

    position: absolute;

    bottom:
        18px;

    left: 0;
    right: 0;

    z-index: 60;

    display:
        flex;

    justify-content:
        center;

    gap:
        15px;
}

.control {

    width:
        70px;

    height:
        60px;

    border:
        2px solid white;

    border-radius:
        17px;

    background:
        #06182ccc;

    color:
        white;

    font-size:
        27px;

    font-weight:
        900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    #player {

        bottom:
            105px;
    }

    .train {

        width:
            105px;

        height:
            72px;
    }

    .car {

        width:
            85px;

        height:
            48px;
    }

}

</style>

</head>


<body>


<div id="game">


    <!-- SKY -->

    <div id="sky"></div>


    <!-- CLOUDS -->

    <div class="cloud cloud1"></div>

    <div class="cloud cloud2"></div>


    <!-- CITY -->

    <div id="city">

        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

    </div>


    <!-- GROUND -->

    <div id="ground"></div>


    <!-- TRACKS -->

    <div id="trackArea">

        <div class="track left">

            <div class="rail rail1"></div>
            <div class="rail rail2"></div>

            <div class="sleeper s1"></div>
            <div class="sleeper s2"></div>
            <div class="sleeper s3"></div>
            <div class="sleeper s4"></div>
            <div class="sleeper s5"></div>
            <div class="sleeper s6"></div>

        </div>


        <div class="track center">

            <div class="rail rail1"></div>
            <div class="rail rail2"></div>

            <div class="sleeper s1"></div>
            <div class="sleeper s2"></div>
            <div class="sleeper s3"></div>
            <div class="sleeper s4"></div>
            <div class="sleeper s5"></div>
            <div class="sleeper s6"></div>

        </div>


        <div class="track right">

            <div class="rail rail1"></div>
            <div class="rail rail2"></div>

            <div class="sleeper s1"></div>
            <div class="sleeper s2"></div>
            <div class="sleeper s3"></div>
            <div class="sleeper s4"></div>
            <div class="sleeper s5"></div>
            <div class="sleeper s6"></div>

        </div>

    </div>


    <!-- PLAYER -->

    <div id="player">

        <div class="playerHead"></div>

        <div class="playerBody">
            JC
        </div>

        <div class="arm left"></div>

        <div class="arm right"></div>

        <div class="leg left"></div>

        <div class="leg right"></div>

    </div>


    <!-- LOGO -->

    <div id="logo">

        <strong>
            JC
        </strong>

        <span>
            JOSHUA
        </span>

        <span>
            CHIKE
        </span>

    </div>


    <!-- PAUSE -->

    <button id="pause">
        Ⅱ
    </button>


    <!-- HUD -->

    <div id="hud">

        <div id="score">
            000000
        </div>

        <div class="hudItem">
            🪙
            <span id="coins">
                0
            </span>
        </div>

        <div class="hudItem">
            HIGH SCORE:
            <span id="highScore">
                0
            </span>

    <!-- START -->

    <div id="startScreen">

    <div id="controls">

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const game =
    document.getElementById(
        "game"
    );

const player =
    document.getElementById(
        "player"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const pauseButton =
    document.getElementById(
        "pause"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const restart =
    document.getElementById(
        "restart"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const coinsElement =
    document.getElementById(
        "coins"
    );

const highScoreElement =
    document.getElementById(
        "highScore"
    );


/* =====================================================
   VARIABLES
===================================================== */

let playing = false;

let paused = false;

let score = 0;

let coins = 0;

let speed = 1;

let lane = 1;

let targetLane = 1;

let jumping = false;

let jumpStart = 0;

let lastTime = 0;

let obstacleTimer = 0;

let coinTimer = 0;

let obstacles = [];

let coinsList = [];

let highScore =
    Number(
        localStorage.getItem(
            "JoshuaChikeHighScore"
        )
    ) || 0;


highScoreElement.textContent =
    highScore;


/* =====================================================
   LANE POSITIONS
===================================================== */

function lanePosition(
    selectedLane
) {

    const positions = [
        "28%",
        "50%",
        "72%"
    ];

    return positions[
        selectedLane
    ];
}


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer() {

    player.style.left =
        lanePosition(
            Math.round(lane)
        );

}


/* =====================================================
   MOVE LEFT
===================================================== */

function moveLeft() {

    if (
        !playing ||
        paused
    )
        return;


    targetLane--;


    if (
        targetLane < 0
    ) {

        targetLane = 0;

    }

}


/* =====================================================
   MOVE RIGHT
===================================================== */

function moveRight() {

    if (
        !playing ||
        paused
    )
        return;


    targetLane++;


    if (
        targetLane > 2
    ) {

        targetLane = 2;

    }

}


/* =====================================================
   JUMP
===================================================== */

function jump() {

    if (
        !playing ||
        paused ||
        jumping
    )
        return;


    jumping = true;

    jumpStart =
        performance.now();

    player.classList.add(
        "jumping"
    );


    setTimeout(
        function() {

            jumping = false;

            player.classList.remove(
                "jumping"
            );

        },
        650
    );

}


/* =====================================================
   CREATE TRAIN
===================================================== */

function createTrain() {

    const laneNumber =
        Math.floor(
            Math.random() * 3
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "obstacle";


    const train =
        document.createElement(
            "div"
        );


    train.className =
        "train";


    element.appendChild(
        train
    );


    game.appendChild(
        element
    );


    obstacles.push({

        element:
            element,

        lane:
            laneNumber,

        type:
            "train",

        distance:
            -15

    });

}


/* =====================================================
   CREATE CAR
===================================================== */

function createCar() {

    const laneNumber =
        Math.floor(
            Math.random() * 3
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "obstacle";


    const car =
        document.createElement(
            "div"
        );


    car.className =
        "car";


    element.appendChild(
        car
    );


    game.appendChild(
        element
    );


    obstacles.push({

        element:
            element,

        lane:
            laneNumber,

        type:
            "car",

        distance:
            -15

    });

}


/* =====================================================
   CREATE COIN
===================================================== */

function createCoin() {

    const laneNumber =
        Math.floor(
            Math.random() * 3
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "coin";


    element.textContent =
        "₦";


    game.appendChild(
        element
    );


    coinsList.push({

        element:
            element,

        lane:
            laneNumber,

        distance:
            -15,

        collected:
            false

    });

}


/* =====================================================
   POSITION OBJECT
===================================================== */

function positionObject(
    object
) {

    const distance =
        Math.max(
            0,
            object.distance
        );


    const laneX =
        lanePosition(
            object.lane
        );


    /*
       Perspective:
       Objects start small
       in the distance and
       become larger as they
       approach the player.
    */

    const scale =
        0.25 +
        distance / 18;


    const top =
        42 +
        distance * 0.55;


    object.element.style.left =
        laneX;


    object.element.style.top =
        top + "%";


    object.element.style.transform =
        `
        translateX(-50%)
        scale(${scale})
        `;


    object.element.style.zIndex =
        Math.floor(
            10 +
            distance
        );

}


/* =====================================================
   COLLISION
===================================================== */

function collision(
    object
) {

    if (
        object.lane !==
        Math.round(lane)
    )
        return false;


    /*
       The collision zone is
       near the player.
    */

    if (
        object.distance <
        78 ||
        object.distance >
        100
    )
        return false;


    /*
       Jumping avoids cars
       and trains.
    */

    if (jumping)
        return false;


    return true;

}


/* =====================================================
   COLLECT COIN
===================================================== */

function collectCoin(
    coin
) {

    if (
        coin.collected
    )
        return;


    if (
        coin.lane !==
        Math.round(lane)
    )
        return;


    if (
        coin.distance >
        76 &&
        coin.distance <
        100
    ) {

        coin.collected =
            true;

        coins++;

        score += 150;

        coin.element.remove();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    playing = false;

    paused = false;


    if (
        Math.floor(score)
        >
        highScore
    ) {

        highScore =
            Math.floor(score);


        localStorage.setItem(
            "JoshuaChikeHighScore",
            highScore
        );


        highScoreElement.textContent =
            highScore;

    }


    gameOver.style.display =
        "block";

}


/* =====================================================
   CLEAR OLD OBJECTS
===================================================== */

function clearObjects() {

    obstacles.forEach(
        object => {

            if (
                object.element
            ) {

                object.element.remove();

            }

        }
    );


    coinsList.forEach(
        coin => {

            if (
                coin.element
            ) {

                coin.element.remove();

            }

        }
    );


    obstacles = [];

    coinsList = [];

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    clearObjects();


    score = 0;

    coins = 0;

    speed = 1;

    lane = 1;

    targetLane = 1;

    jumping = false;

    obstacleTimer = 0;

    coinTimer = 0;

    playing = true;

    paused = false;


    startScreen.style.display =
        "none";


    gameOver.style.display =
        "none";


    pauseButton.textContent =
        "Ⅱ";


    updatePlayer();


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   MAIN GAME LOOP
===================================================== */

function gameLoop(
    currentTime
) {

    if (!playing)
        return;


    if (paused)
        return;


    const delta =
        Math.min(
            0.05,
            (
                currentTime -
                lastTime
            ) / 1000
        );


    lastTime =
        currentTime;


    /* ===============================================
       SPEED
    =============================================== */

    speed =
        Math.min(
            4,
            1 +
            score / 3500
        );


    /* ===============================================
       SCORE
    =============================================== */

    score +=
        delta *
        100 *
        speed;


    scoreElement.textContent =
        String(
            Math.floor(score)
        ).padStart(
            6,
            "0"
        );


    coinsElement.textContent =
        coins;


    /* ===============================================
       FAST LANE RESPONSE
    =============================================== */

    lane +=
        (
            targetLane -
            lane
        ) *
        Math.min(
            1,
            delta * 30
        );


    updatePlayer();


    /* ===============================================
       SPAWN OBSTACLES
    =============================================== */

    obstacleTimer +=
        delta * 1000;


    const spawnRate =
        Math.max(
            480,
            1200 -
            speed * 170
        );


    if (
        obstacleTimer >
        spawnRate
    ) {

        /*
           Randomly spawn train
           or car.
        */

        if (
            Math.random() <
            0.55
        ) {

            createTrain();

        } else {

            createCar();

        }


        obstacleTimer = 0;

    }


    /* ===============================================
       SPAWN COINS
    =============================================== */

    coinTimer +=
        delta * 1000;


    if (
        coinTimer >
        650
    ) {

        createCoin();

        coinTimer = 0;

    }


    /* ===============================================
       MOVE OBSTACLES
    =============================================== */

    obstacles.forEach(
        object => {

            object.distance +=
                delta *
                55 *
                speed;


            positionObject(
                object
            );


            if (
                collision(
                    object
                )
            ) {

                endGame();

            }

        }
    );


    /* ===============================================
       REMOVE OBSTACLES
    =============================================== */

    obstacles =
        obstacles.filter(
            object => {

                if (
                    object.distance >
                    125
                ) {

                    if (
                        object.element
                    ) {

                        object.element.remove();

                    }

                    return false;

                }


                return true;

            }
        );


    /* ===============================================
       MOVE COINS
    =============================================== */

    coinsList.forEach(
        coin => {

            coin.distance +=
                delta *
                55 *
                speed;


            positionObject(
                coin
            );


            collectCoin(
                coin
            );

        }
    );


    /* ===============================================
       REMOVE COINS
    =============================================== */

    coinsList =
        coinsList.filter(
            coin => {

                if (
                    coin.collected ||
                    coin.distance >
                    125
                ) {

                    if (
                        coin.element
                    ) {

                        coin.element.remove();

                    }

                    return false;

                }


                return true;

            }
        );


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   PAUSE
===================================================== */

pauseButton.onclick =
function() {

    if (!playing)
        return;


    paused =
        !paused;


    if (paused) {

        pauseButton.textContent =
            "▶";

    } else {

        pauseButton.textContent =
            "Ⅱ";


        lastTime =
            performance.now();


        requestAnimationFrame(
            gameLoop
        );

    }

};


/* =====================================================
   BUTTON CONTROLS
===================================================== */

document
    .getElementById(
        "left"
    )
    .onclick =
    moveLeft;


document
    .getElementById(
        "right"
    )
    .onclick =
    moveRight;


document
    .getElementById(
        "jump"
    )
    .onclick =
    jump;


/* =====================================================
   START / RESTART
===================================================== */

startButton.onclick =
    startGame;


restart.onclick =
    startGame;


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            moveLeft();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            moveRight();

        }


        if (
            event.key ===
            "ArrowUp" ||
            event.key ===
            " "
        ) {

            jump();

        }


        if (
            event.key.toLowerCase()
            === "p"
        ) {

            pauseButton.click();

        }

    }
);


/* =====================================================
   SWIPE CONTROLS
===================================================== */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event
            .changedTouches[0]
            .clientX;

        touchStartY =
            event
            .changedTouches[0]
            .clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const x =
            event
            .changedTouches[0]
            .clientX;

        const y =
            event
            .changedTouches[0]
            .clientY;


        const dx =
            x -
            touchStartX;


        const dy =
            y -
            touchStartY;


        const threshold =
            30;


        if (
            Math.abs(dx) <
            threshold &&
            Math.abs(dy) <
            threshold
        ) {

            return;

        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                dx > 0
            ) {

                moveRight();

            } else {

                moveLeft();

            }

        } else {

            if (
                dy < 0
            ) {

                jump();

            }

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   PREVENT PAGE SCROLL
===================================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
