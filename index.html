<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JOSHUA CHIKE: OBSTACLE RUN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

/* LOGO */
#logo {
    position: absolute;
    top: 15px;
    left: 15px;

    width: 75px;
    height: 75px;

    border-radius: 50%;
    background: #e60000;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    font-size: 9px;
    font-weight: bold;

    border: 3px solid white;
    box-shadow: 0 0 15px rgba(255,0,0,.7);
}

/* SCORE */
#score {
    position: absolute;
    top: 20px;
    right: 20px;

    font-size: 22px;
    font-weight: bold;

    text-shadow: 2px 2px 4px black;
}

/* COINS */
#coins {
    position: absolute;
    top: 52px;
    right: 20px;

    font-size: 17px;
    color: #ffd700;

    text-shadow: 2px 2px 4px black;
}

/* SPEED */
#speed {
    position: absolute;
    top: 80px;
    right: 20px;

    font-size: 14px;
    color: #00ffcc;
}

/* GAME OVER */
#gameOver {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 85%;
    max-width: 400px;

    padding: 30px;

    background: rgba(0,0,0,.88);
    border: 2px solid #ff3333;
    border-radius: 20px;

    text-align: center;

    display: none;
    pointer-events: auto;
}

#gameOver h1 {
    color: #ff3333;
    margin-bottom: 15px;
}

#gameOver p {
    margin: 8px;
}

button {
    margin-top: 20px;

    padding: 14px 30px;

    border: none;
    border-radius: 12px;

    background: #e60000;
    color: white;

    font-size: 18px;
    font-weight: bold;
}

/* START SCREEN */
#startScreen {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            rgba(0,0,0,.65),
            rgba(0,0,0,.8)
        );

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    pointer-events: auto;
}

#startScreen h1 {
    color: white;
    font-size: 30px;
    text-align: center;

    margin-bottom: 10px;
}

#startScreen p {
    color: #ccc;
    margin-bottom: 20px;
}

#startButton {
    background: #e60000;
    padding: 16px 45px;
    border-radius: 15px;
}

/* MOBILE CONTROLS */
#controls {
    position: absolute;
    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 15px;

    pointer-events: auto;
}

.control {
    width: 65px;
    height: 55px;

    border-radius: 15px;

    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 25px;
}
</style>
</head>

<body>

<div id="ui">

    <div id="logo">
        JOSHUA<br>CHIKE
    </div>

    <div id="score">
        SCORE: 0
    </div>

    <div id="coins">
        🪙 0
    </div>

    <div id="speed">
        SPEED: 1.0x
    </div>

    <div id="startScreen">

        <h1>JOSHUA CHIKE:<br>OBSTACLE RUN</h1>

        <p>Swipe left, right or up to move</p>

        <button id="startButton">
            START GAME
        </button>

    </div>

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p id="finalScore">
            Score: 0
        </p>

        <p id="finalCoins">
            Coins: 0
        </p>

        <button id="restartButton">
            PLAY AGAIN
        </button>

    </div>

    <div id="controls">

        <div class="control" id="left">
            ◀
        </div>

        <div class="control" id="jump">
            ▲
        </div>

        <div class="control" id="right">
            ▶
        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   JOSHUA CHIKE - OBSTACLE RUN
   ===================================================== */

/* ---------- GAME VARIABLES ---------- */

let scene;
let camera;
let renderer;

let player;

let obstacles = [];
let coins = [];

let gameRunning = false;
let gameOver = false;

let score = 0;
let coinCount = 0;

let speed = 0.35;
let maxSpeed = 1.5;

let lane = 1;

let playerY = 1;

let velocityY = 0;

let gravity = -0.035;

let jumpPower = 0.65;

let lastTime = 0;

let spawnTimer = 0;
let coinTimer = 0;

let distance = 0;


/* ---------- LANE POSITIONS ---------- */

const lanes = [-3, 0, 3];


/* ---------- CREATE SCENE ---------- */

function createScene() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050816);

    scene.fog = new THREE.Fog(
        0x050816,
        20,
        150
    );


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        300
    );

    camera.position.set(
        0,
        6,
        10
    );

    camera.lookAt(
        0,
        1,
        -30
    );


    /* RENDERER */

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    const ambient = new THREE.AmbientLight(
        0xffffff,
        0.7
    );

    scene.add(ambient);


    const light = new THREE.DirectionalLight(
        0xffffff,
        1
    );

    light.position.set(
        5,
        10,
        10
    );

    scene.add(light);


    createWorld();

    createPlayer();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}


/* ---------- WORLD ---------- */

function createWorld() {

    /* ROAD */

    const roadGeometry =
        new THREE.PlaneGeometry(
            12,
            500
        );

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x252525
        });

    const road =
        new THREE.Mesh(
            roadGeometry,
            roadMaterial
        );

    road.rotation.x =
        -Math.PI / 2;

    road.position.z = -150;

    scene.add(road);


    /* SIDE LINES */

    createLine(-6);
    createLine(6);


    /* LANE MARKINGS */

    createLaneLine(-1.5);
    createLaneLine(1.5);


    /* SIDE BUILDINGS */

    for (
        let z = -20;
        z > -300;
        z -= 20
    ) {

        createBuilding(
            -11,
            z
        );

        createBuilding(
            11,
            z
        );

    }

}


/* ---------- ROAD LINES ---------- */

function createLine(x) {

    const geometry =
        new THREE.BoxGeometry(
            0.15,
            0.05,
            500
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xff2222
        });

    const line =
        new THREE.Mesh(
            geometry,
            material
        );

    line.position.set(
        x,
        0.03,
        -150
    );

    scene.add(line);
}


/* ---------- LANE LINE ---------- */

function createLaneLine(x) {

    for (
        let z = 0;
        z > -300;
        z -= 8
    ) {

        const geometry =
            new THREE.BoxGeometry(
                0.08,
                0.04,
                4
            );

        const material =
            new THREE.MeshBasicMaterial({
                color: 0xffffff
            });

        const line =
            new THREE.Mesh(
                geometry,
                material
            );

        line.position.set(
            x,
            0.04,
            z
        );

        scene.add(line);

    }

}


/* ---------- BUILDINGS ---------- */

function createBuilding(x, z) {

    const height =
        5 + Math.random() * 10;

    const width =
        4 + Math.random() * 4;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            8
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                Math.random() > .5
                ? 0x172033
                : 0x202020
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height / 2,
        z
    );

    scene.add(building);
}


/* ---------- PLAYER ---------- */

function createPlayer() {

    const group =
        new THREE.Group();


    /* BODY */

    const bodyGeometry =
        new THREE.BoxGeometry(
            1.2,
            1.7,
            0.9
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x00aaff
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.y = 1;

    group.add(body);


    /* HEAD */

    const headGeometry =
        new THREE.SphereGeometry(
            0.55,
            16,
            16
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffcc99
        });

    const head =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    head.position.y = 2.1;

    group.add(head);


    /* RED SHIRT */

    const shirtGeometry =
        new THREE.BoxGeometry(
            1.3,
            0.5,
            0.95
        );

    const shirtMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xff0000
        });

    const shirt =
        new THREE.Mesh(
            shirtGeometry,
            shirtMaterial
        );

    shirt.position.y = 1.35;

    group.add(shirt);


    group.position.set(
        0,
        0,
        4
    );


    player = group;

    scene.add(player);

}


/* ---------- OBSTACLE ---------- */

function spawnObstacle() {

    const geometry =
        new THREE.BoxGeometry(
            2,
            2.5,
            2
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xff3333
        });

    const obstacle =
        new THREE.Mesh(
            geometry,
            material
        );

    obstacle.position.set(
        lanes[
            Math.floor(
                Math.random() * 3
            )
        ],
        1.25,
        -80
    );

    scene.add(obstacle);

    obstacles.push(obstacle);

}


/* ---------- COIN ---------- */

function spawnCoin() {

    const geometry =
        new THREE.TorusGeometry(
            0.5,
            0.15,
            12,
            24
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 0.8
        });

    const coin =
        new THREE.Mesh(
            geometry,
            material
        );

    coin.position.set(
        lanes[
            Math.floor(
                Math.random() * 3
            )
        ],
        1.5 +
        Math.random() * 2,
        -80
    );

    coin.rotation.x =
        Math.PI / 2;

    scene.add(coin);

    coins.push(coin);

}


/* ---------- MOVE LEFT ---------- */

function moveLeft() {

    if (!gameRunning)
        return;

    lane--;

    if (lane < 0)
        lane = 0;

}


/* ---------- MOVE RIGHT ---------- */

function moveRight() {

    if (!gameRunning)
        return;

    lane++;

    if (lane > 2)
        lane = 2;

}


/* ---------- JUMP ---------- */

function jump() {

    if (!gameRunning)
        return;

    if (player.position.y <= 0.05) {

        velocityY =
            jumpPower;

    }

}


/* ---------- COLLISION ---------- */

function collision(a, b) {

    const boxA =
        new THREE.Box3()
        .setFromObject(a);

    const boxB =
        new THREE.Box3()
        .setFromObject(b);

    return boxA.intersectsBox(
        boxB
    );

}


/* ---------- GAME OVER ---------- */

function endGame() {

    gameRunning = false;
    gameOver = true;

    document.getElementById(
        "finalScore"
    ).innerText =
        "Score: " +
        Math.floor(score);

    document.getElementById(
        "finalCoins"
    ).innerText =
        "Coins: " +
        coinCount;

    document.getElementById(
        "gameOver"
    ).style.display =
        "block";

}


/* ---------- RESET ---------- */

function resetGame() {

    obstacles.forEach(
        o => scene.remove(o)
    );

    coins.forEach(
        c => scene.remove(c)
    );

    obstacles = [];
    coins = [];

    score = 0;
    coinCount = 0;

    speed = 0.35;

    lane = 1;

    player.position.set(
        0,
        0,
        4
    );

    velocityY = 0;

    gameOver = false;

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";

    gameRunning = true;

}


/* ---------- START ---------- */

function startGame() {

    document.getElementById(
        "startScreen"
    ).style.display =
        "none";

    resetGame();

}


/* ---------- UPDATE ---------- */

function update(delta) {

    if (!gameRunning)
        return;


    /* SPEED INCREASE */

    speed +=
        delta * 0.000008;

    if (speed > maxSpeed)
        speed = maxSpeed;


    /* SCORE */

    score +=
        delta * 0.02;


    /* PLAYER LANE MOVEMENT */

    const targetX =
        lanes[lane];

    player.position.x +=
        (targetX -
        player.position.x) *
        0.25;


    /* JUMP PHYSICS */

    velocityY +=
        gravity;

    player.position.y +=
        velocityY;

    if (
        player.position.y < 0
    ) {

        player.position.y = 0;

        velocityY = 0;

    }


    /* SPAWN OBSTACLES */

    spawnTimer += delta;

    if (
        spawnTimer >
        Math.max(
            500,
            1000 -
            speed * 300
        )
    ) {

        spawnObstacle();

        spawnTimer = 0;

    }


    /* SPAWN COINS */

    coinTimer += delta;

    if (
        coinTimer > 700
    ) {

        spawnCoin();

        coinTimer = 0;

    }


    /* MOVE OBSTACLES */

    obstacles.forEach(
        (obstacle, index) => {

            obstacle.position.z +=
                speed * delta * 0.06;

            obstacle.rotation.y +=
                0.01;


            if (
                collision(
                    player,
                    obstacle
                )
            ) {

                endGame();

            }


            if (
                obstacle.position.z > 15
            ) {

                scene.remove(
                    obstacle
                );

                obstacles.splice(
                    index,
                    1
                );

            }

        }
    );


    /* MOVE COINS */

    coins.forEach(
        (coin, index) => {

            coin.position.z +=
                speed * delta * 0.06;

            coin.rotation.z +=
                0.08;


            if (
                collision(
                    player,
                    coin
                )
            ) {

                coinCount++;

                score += 50;

                scene.remove(
                    coin
                );

                coins.splice(
                    index,
                    1
                );

            }


            if (
                coin.position.z > 15
            ) {

                scene.remove(
                    coin
                );

                coins.splice(
                    index,
                    1
                );

            }

        }
    );


    /* CAMERA */

    camera.position.x +=
        (
            player.position.x -
            camera.position.x
        ) * 0.08;


    /* UI */

    document.getElementById(
        "score"
    ).innerText =
        "SCORE: " +
        Math.floor(score);

    document.getElementById(
        "coins"
    ).innerText =
        "🪙 " +
        coinCount;

    document.getElementById(
        "speed"
    ).innerText =
        "SPEED: " +
        (speed / 0.35)
        .toFixed(1) +
        "x";

}


/* ---------- ANIMATION ---------- */

function animate(time) {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            time - lastTime,
            40
        );

    lastTime = time;

    update(delta);

    renderer.render(
        scene,
        camera
    );

}


/* ---------- RESIZE ---------- */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* ---------- BUTTONS ---------- */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    resetGame
);

document.getElementById(
    "left"
).addEventListener(
    "pointerdown",
    moveLeft
);

document.getElementById(
    "right"
).addEventListener(
    "pointerdown",
    moveRight
);

document.getElementById(
    "jump"
).addEventListener(
    "pointerdown",
    jump
);


/* ---------- KEYBOARD ---------- */

document.addEventListener(
    "keydown",
    e => {

        if (e.key === "ArrowLeft")
            moveLeft();

        if (e.key === "ArrowRight")
            moveRight();

        if (
            e.key === "ArrowUp" ||
            e.key === " "
        )
            jump();

    }
);


/* ---------- SWIPE CONTROLS ---------- */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
    "touchstart",
    e => {

        touchStartX =
            e.changedTouches[0].screenX;

        touchStartY =
            e.changedTouches[0].screenY;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    e => {

        const endX =
            e.changedTouches[0].screenX;

        const endY =
            e.changedTouches[0].screenY;

        const dx =
            endX - touchStartX;

        const dy =
            endY - touchStartY;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                Math.abs(dx) > 30
            ) {

                if (dx > 0)
                    moveRight();
                else
                    moveLeft();

            }

        } else {

            if (
                dy < -30
            )
                jump();

        }

    },
    { passive: true }
);


/* ---------- START ENGINE ---------- */

createScene();

</script>

</body>
</html>
